name: Stage Maven release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Lockstep version for all three repositories
        required: true
        type: string
      tiqian_ref:
        description: Tiqian git ref
        required: true
        default: main
        type: string
      math_compose_ref:
        description: math-compose git ref
        required: true
        default: main
        type: string
      namespace:
        description: Central Portal namespace
        required: true
        default: org.tiqian
        type: string

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      TIQIAN_VERSION: ${{ inputs.version }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Check out markdown-compose
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check out Tiqian
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: tiqian-cjk/tiqian
          ref: ${{ inputs.tiqian_ref }}
          path: Tiqian

      - name: Check out math-compose
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: tiqian-cjk/math-compose
          ref: ${{ inputs.math_compose_ref }}
          path: math-compose

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Validate release version
        run: |
          if [[ "$TIQIAN_VERSION" == *-SNAPSHOT ]]; then
            echo "Central staging requires an immutable non-SNAPSHOT version." >&2
            exit 1
          fi

      - name: Verify lockstep Maven consumption
        env:
          TIQIAN_CHECKOUT: Tiqian
          MATH_COMPOSE_CHECKOUT: math-compose
        run: ./scripts/verify-maven-local.sh

      - name: Upload Tiqian modules
        run: ./Tiqian/gradlew -p Tiqian publishTiqianToCentral --no-daemon

      - name: Upload math-compose modules
        run: ./math-compose/gradlew -p math-compose publishMathComposeToCentral --no-daemon

      - name: Upload markdown-compose modules
        run: |
          ./gradlew publishAllPublicationsToCentralRepository \
            -PuseLocalTiqianCheckouts=false \
            -Dmaven.repo.local="$PWD/build/maven-local-smoke/repository" \
            --no-daemon

      - name: Create Central Portal deployment
        env:
          CENTRAL_NAMESPACE: ${{ inputs.namespace }}
        run: |
          authorization="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          curl --fail-with-body --retry 3 \
            --request POST \
            --header "Authorization: Bearer $authorization" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/$CENTRAL_NAMESPACE?publishing_type=user_managed"
