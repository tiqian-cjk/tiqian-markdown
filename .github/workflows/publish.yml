name: Stage Tiqian Markdown Maven release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Lockstep version for all three repositories
        required: true
        type: string
      tiqian_ref:
        description: Tiqian git ref
        required: true
        default: main
        type: string
      tiqian_math_ref:
        description: Tiqian Math git ref
        required: true
        default: main
        type: string
      namespace:
        description: Central Portal namespace
        required: true
        default: org.tiqian
        type: string

permissions:
  contents: read

concurrency:
  group: stage-tiqian-markdown-maven-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      TIQIAN_VERSION: ${{ inputs.version }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Check out Tiqian Markdown
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TIQIAN_VERSION" == *-SNAPSHOT ]]; then
            echo "Central staging requires an immutable non-SNAPSHOT version." >&2
            exit 1
          fi
          for variable in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required release secret $variable is missing." >&2
              exit 1
            fi
          done

      - name: Check out Tiqian
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: tiqian-cjk/tiqian
          ref: ${{ inputs.tiqian_ref }}
          path: Tiqian

      - name: Check out Tiqian Math
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: tiqian-cjk/tiqian-math
          ref: ${{ inputs.tiqian_math_ref }}
          path: tiqian-math

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Install deterministic JVM test font
        run: |
          mkdir -p "$HOME/.local/share/fonts" "$HOME/.config/fontconfig"
          install -m 0644 \
            src/jvmTest/resources/fonts/SourceHanSansCN-Regular.otf \
            "$HOME/.local/share/fonts/SourceHanSansCN-Regular.otf"
          install -m 0644 \
            .github/fontconfig/markdown-compose-tests.conf \
            "$HOME/.config/fontconfig/fonts.conf"
          fc-cache -f
          fc-match "sans-serif" | grep -F "SourceHanSansCN-Regular.otf"
          fc-match "Inter Variable" | grep -F "SourceHanSansCN-Regular.otf"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # Tiqian's :shaping:native-font pins CMake 4.3.2, which the Android SDK does not
      # bundle; publishing Tiqian builds it. Prepend the pinned build so this workflow
      # uses the same native toolchain as CI.
      - name: Install CMake 4.3.2 for Tiqian native-font
        run: |
          python3 -m venv "$HOME/cmake-venv"
          "$HOME/cmake-venv/bin/pip" install --quiet "cmake==4.3.2"
          cmake_bin_dir="$("$HOME/cmake-venv/bin/python" -c 'import cmake, os; print(os.path.join(os.path.dirname(cmake.__file__), "data", "bin"))')"
          echo "$cmake_bin_dir" >> "$GITHUB_PATH"
          "$cmake_bin_dir/cmake" --version

      - name: Verify lockstep Maven consumption
        env:
          TIQIAN_CHECKOUT: Tiqian
          TIQIAN_MATH_CHECKOUT: tiqian-math
        run: ./scripts/verify-maven-local.sh

      - name: Upload Tiqian Markdown modules
        run: |
          ./gradlew publishAllPublicationsToCentralRepository \
            -PtiqianDependencyVersion="$TIQIAN_VERSION" \
            -PtiqianRepository="$PWD/build/maven-local-smoke/repository" \
            -Dmaven.repo.local="$PWD/build/maven-local-smoke/repository" \
            --no-daemon

      - name: Create Central Portal deployment
        env:
          CENTRAL_NAMESPACE: ${{ inputs.namespace }}
        run: |
          authorization="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          curl --fail-with-body --retry 3 \
            --request POST \
            --header "Authorization: Bearer $authorization" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/$CENTRAL_NAMESPACE?publishing_type=user_managed"
