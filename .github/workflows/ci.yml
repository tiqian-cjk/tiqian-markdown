name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      tiqian_version:
        description: Tiqian release to build against; empty takes the newest on the registry
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  # settings.gradle.kts and scripts/verify-maven-local.sh both read this variable.
  TIQIAN_REGISTRY_REPOSITORY: https://registry.tiqian.org/maven/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tiqian Markdown
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check out Tiqian Math
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: tiqian-cjk/tiqian-math
          path: tiqian-math

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Install deterministic JVM test font
        run: |
          mkdir -p "$HOME/.local/share/fonts" "$HOME/.config/fontconfig"
          install -m 0644 \
            src/jvmTest/resources/fonts/SourceHanSansCN-Regular.otf \
            "$HOME/.local/share/fonts/SourceHanSansCN-Regular.otf"
          install -m 0644 \
            .github/fontconfig/markdown-compose-tests.conf \
            "$HOME/.config/fontconfig/fonts.conf"
          fc-cache -f
          fc-match "sans-serif" | grep -F "SourceHanSansCN-Regular.otf"
          fc-match "Inter Variable" | grep -F "SourceHanSansCN-Regular.otf"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Resolve the Tiqian release
        # Every run builds against the newest Tiqian release on the registry, so
        # a Tiqian release that breaks Tiqian Markdown fails the next run. The
        # registry lists a version in maven-metadata.xml once that release has
        # written all its modules. A manual run may name another release.
        env:
          REQUESTED_VERSION: ${{ inputs.tiqian_version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [[ -z "$version" ]]; then
            metadata="${TIQIAN_REGISTRY_REPOSITORY%/}/org/tiqian/tiqian-compose-material3/maven-metadata.xml"
            version="$(curl -fsSL --retry 3 "$metadata" | python3 -c \
              'import sys, xml.etree.ElementTree as ET; print(ET.parse(sys.stdin).getroot().findtext("versioning/release") or "")')"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::no usable Tiqian release version: '$version'"
            exit 1
          fi
          echo "::notice::Building against Tiqian $version"
          echo "TIQIAN_REGISTRY_VERSION=$version" >> "$GITHUB_ENV"

      - name: Test through isolated Maven repository
        env:
          TIQIAN_MATH_CHECKOUT: tiqian-math
        run: ./scripts/verify-maven-local.sh
