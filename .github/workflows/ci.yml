name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Tiqian release this workflow builds against, resolved from
  # registry.tiqian.org. Raise it after each Tiqian release.
  TIQIAN_RELEASE: 0.1.0-alpha.13

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tiqian Markdown
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check out Tiqian Math
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: tiqian-cjk/tiqian-math
          path: tiqian-math

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Install deterministic JVM test font
        run: |
          mkdir -p "$HOME/.local/share/fonts" "$HOME/.config/fontconfig"
          install -m 0644 \
            src/jvmTest/resources/fonts/SourceHanSansCN-Regular.otf \
            "$HOME/.local/share/fonts/SourceHanSansCN-Regular.otf"
          install -m 0644 \
            .github/fontconfig/markdown-compose-tests.conf \
            "$HOME/.config/fontconfig/fonts.conf"
          fc-cache -f
          fc-match "sans-serif" | grep -F "SourceHanSansCN-Regular.otf"
          fc-match "Inter Variable" | grep -F "SourceHanSansCN-Regular.otf"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Test through isolated Maven repository
        env:
          TIQIAN_MATH_CHECKOUT: tiqian-math
          TIQIAN_REGISTRY_VERSION: ${{ env.TIQIAN_RELEASE }}
        run: ./scripts/verify-maven-local.sh
