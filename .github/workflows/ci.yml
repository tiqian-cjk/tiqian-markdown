name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tiqian Markdown
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check out Tiqian
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: tiqian-cjk/tiqian
          path: Tiqian

      - name: Check out Tiqian Math
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: tiqian-cjk/tiqian-math
          path: tiqian-math

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Install deterministic JVM test font
        run: |
          mkdir -p "$HOME/.local/share/fonts" "$HOME/.config/fontconfig"
          install -m 0644 \
            src/jvmTest/resources/fonts/SourceHanSansCN-Regular.otf \
            "$HOME/.local/share/fonts/SourceHanSansCN-Regular.otf"
          install -m 0644 \
            .github/fontconfig/markdown-compose-tests.conf \
            "$HOME/.config/fontconfig/fonts.conf"
          fc-cache -f
          fc-match "sans-serif" | grep -F "SourceHanSansCN-Regular.otf"
          fc-match "Inter Variable" | grep -F "SourceHanSansCN-Regular.otf"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # Tiqian's :shaping:native-font pins CMake 4.3.2, which the Android SDK does not
      # bundle; publishing Tiqian to Maven Local builds it. The runner ships a different
      # cmake at /usr/local/bin, so prepend the pinned build to PATH (via GITHUB_PATH) so
      # AGP resolves 4.3.2, mirroring the local homebrew install.
      - name: Install CMake 4.3.2 for Tiqian native-font
        run: |
          python3 -m venv "$HOME/cmake-venv"
          "$HOME/cmake-venv/bin/pip" install --quiet "cmake==4.3.2"
          cmake_bin_dir="$("$HOME/cmake-venv/bin/python" -c 'import cmake, os; print(os.path.join(os.path.dirname(cmake.__file__), "data", "bin"))')"
          echo "$cmake_bin_dir" >> "$GITHUB_PATH"
          "$cmake_bin_dir/cmake" --version

      - name: Test JVM and compile Android
        env:
          TIQIAN_CHECKOUT: Tiqian
          TIQIAN_MATH_CHECKOUT: tiqian-math
        run: ./gradlew jvmTest compileAndroidMain :preview:compileKotlinJvm

      - name: Verify pure Maven consumption
        env:
          TIQIAN_CHECKOUT: Tiqian
          TIQIAN_MATH_CHECKOUT: tiqian-math
        run: ./scripts/verify-maven-local.sh
